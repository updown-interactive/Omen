[package]
name = "omen-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
omen = { path = "../crates/omen", default-features = false }
omen-cli = { path = "../crates/omen-cli" }
omen-macro-core = { path = "../crates/omen-macro-core" }
futures.workspace = true
syn.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["now"] }
trash = "5.3.0"
tempfile = "3"

[features]
default = ["native"]
native = ["omen/native"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
omen-gpui = { path = "../crates/omen-gpui" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
