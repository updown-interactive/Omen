[workspace]
resolver = "2"
members = [
    "crates/omen",
    "studio",
    "crates/gpui-android",
    "crates/omen-core",
    "crates/omen-web",
    "crates/omen-plugin",
    "crates/omen-native",
    "crates/omen-plugin-ffi",
    "crates/omen-plugin-web",
    "crates/omen-macros",
    "crates/omen-macro-core",
    "crates/omen-ui",
    "crates/omen-format",
    "crates/omen-gpui",
    "crates/omen-cli",
    "crates/omen-components",
    "examples/hello-world",
    "examples/declarative-ui",
    "examples/controls-gallery",
    "examples/reactive-state",
    "examples/separated-logic",
    "examples/navigation-styling",
    "examples/native-plugins",
    "examples/platform-ui",
    "examples/native-mobile",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/updown-interactive/Omen"

[workspace.dependencies]
thiserror = "2"
futures = "0.3"
syn = { version = "2", features = ["full", "visit-mut", "visit"] }
quote = "1"
proc-macro2 = "1"
clap = { version = "4", features = ["derive"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "faf8f0b6980205ca2659af174790a212ae3c416a" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "faf8f0b6980205ca2659af174790a212ae3c416a", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }

[profile.mobile]
inherits = "dev"
opt-level = 1
debug = 0
incremental = false

# GPUI's by-value element builders produce large stack frames at opt-level 0.
# Optimize the renderer in desktop debug builds as well as release builds.
[profile.dev.package.omen-gpui]
opt-level = 1
