[package]
name = "omen-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "omen"
path = "src/main.rs"

[dependencies]
clap.workspace = true
anyhow = "1"
console = "0.16"
dialoguer = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ctrlc = "3.5.2"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
