[package]
name = "platform-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[dependencies]
omen = { path = "../../crates/omen", default-features = false }
[features]
default = ["desktop"]
desktop = ["native"]
native = ["omen/native"]
web = ["omen/web"]

[lib]
name = "omen_app"
path = "src/main.rs"
crate-type = ["cdylib"]
